name: update halal auto bybit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scraper.py
      - run: |
          git config user.name "bybit-halal-bot"
          git config user.email "bot@bybit.com"
          git add halal_pairs.json
          git commit -m "auto update bybit islamic via API $(date -u)" || exit 0
          git push
