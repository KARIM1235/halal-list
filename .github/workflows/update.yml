name: update halal
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py
      - run: |
          git config user.name "halal-bot"
          git config user.email "bot@example.com"
          git add halal_pairs.json
          git commit -m "live all mubah $(date -u)" || exit 0
          git push
