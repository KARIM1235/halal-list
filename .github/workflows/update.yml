name: update halal
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - env:
          PIF_EMAIL: ${{ secrets.PIF_EMAIL }}
          PIF_PASSWORD: ${{ secrets.PIF_PASSWORD }}
          CH_EMAIL: ${{ secrets.CH_EMAIL }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD }}
        run: python scraper.py
      - run: |
          git config user.name "halal-bot"
          git config user.email "bot@example.com"
          git add halal_pairs.json
          git commit -m "live PIF+CH $(date -u)" || exit 0
          git push
